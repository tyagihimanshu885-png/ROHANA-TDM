<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ROHANA TDM - ULTRA GLB</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box} html,body{width:100%;height:100%;overflow:hidden;background:#000;position:fixed;touch-action:none}
 #game{width:100vw;height:100dvh;position:relative}
 #portrait{position:fixed;inset:0;background:#0f0f0f;display:none;z-index:999;color:#fff;align-items:center;justify-content:center;flex-direction:column;font-family:sans-serif}
 @media (orientation:portrait){ #portrait{display:flex} #game{display:none} }
 #topBar{position:absolute;top:0;left:0;width:100%;height:50px;background:linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:20}
 #info{color:#fff;font-size:11px;background:rgba(0,0,0,0.6);padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.2)}
 #exit{width:38px;height:38px;background:#ff2a2a;border:2px solid #fff;border-radius:50%;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;font-size:18px}
 #joy{position:absolute;bottom:20px;left:20px;width:135px;height:135px;background:rgba(0,0,0,0.28);border-radius:50%;border:1.5px solid rgba(255,255,255,0.25);backdrop-filter:blur(6px);z-index:15}
 #knob{position:absolute;width:58px;height:58px;background:radial-gradient(circle at 30% 30%, #fff, #888);border-radius:50%;left:38px;top:38px;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,0.6)}
 #camArea{position:absolute;top:0;right:0;width:58%;height:100%;z-index:10}
 #fire{position:absolute;bottom:30px;right:30px;width:86px;height:86px;background:radial-gradient(circle, rgba(255,60,60,0.8), rgba(180,0,0,0.6));border-radius:50%;border:2px solid rgba(255,255,255,0.5);z-index:15;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;box-shadow:0 0 20px rgba(255,0,0,0.6)}
 canvas{display:block;width:100%!important;height:100%!important}
 #loading{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;z-index:100;font-family:sans-serif;flex-direction:column}
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="portrait"><div style="font-size:50px">📱➡️</div><h2>Phone Aada Karo</h2><p>ROHANA TDM ULTRA</p></div>
<div id="game">
<div id="loading"><h2>🔥 ROHANA TDM Loading...</h2><p>Real Textures Loading</p></div>
<div id="topBar"><div id="info">🚜 ROHANA TDM - ULTRA | 4K Textures</div><div id="exit" onclick="if(confirm('Exit?')) location.href='about:blank'">X</div></div>
<div id="joy"><div id="knob"></div></div><div id="camArea"></div><div id="fire">FIRE</div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x87B5E8); scene.fog=new THREE.FogExp2(0xD8C49A,0.025);
const camera=new THREE.PerspectiveCamera(62,window.innerWidth/window.innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(window.innerWidth,window.innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15; document.getElementById('game').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xfff2dd,0.65));
const sun=new THREE.DirectionalLight(0xfff5e0,1.5); sun.position.set(30,40,20); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-30; sun.shadow.camera.right=30; sun.shadow.camera.top=30; sun.shadow.camera.bottom=-30; scene.add(sun);

const texLoader=new THREE.TextureLoader();
const brickTex=texLoader.load('https://threejs.org/examples/textures/brick_diffuse.jpg'); brickTex.wrapS=brickTex.wrapT=THREE.RepeatWrapping; brickTex.repeat.set(2,1);
const brickBump=texLoader.load('https://threejs.org/examples/textures/brick_bump.jpg'); brickBump.wrapS=brickBump.wrapT=THREE.RepeatWrapping; brickBump.repeat.set(2,1);
const grassTex=texLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg'); grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping; grassTex.repeat.set(6,6);

const floorMat=new THREE.MeshStandardMaterial({map:grassTex, color:0x9E7B55, roughness:0.9});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(42,32),floorMat); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

function wall(x,z,w,d,h=2.7){ const mat=new THREE.MeshStandardMaterial({map:brickTex, bumpMap:brickBump, bumpScale:0.15, roughness:0.65, color:0xffffff}); const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,h/2,z); m.castShadow=true; m.receiveShadow=true; scene.add(m); }
wall(0,15,14,1); wall(0,-15,14,1); wall(-20,0,1,30); wall(20,0,1,30); wall(12,15,14,1); wall(-12,15,14,1); wall(12,-15,14,1); wall(-12,-15,14,1);
function Lwall(x,z,rot){ const g=new THREE.Group(); const mat=new THREE.MeshStandardMaterial({map:brickTex, bumpMap:brickBump, bumpScale:0.12, roughness:0.7}); const a=new THREE.Mesh(new THREE.BoxGeometry(3.2,2,0.8),mat); a.position.set(1.2,1,0); a.castShadow=true; const b=new THREE.Mesh(new THREE.BoxGeometry(0.8,2,3.2),mat); b.position.set(0,1,1.2); b.castShadow=true; g.add(a,b); g.position.set(x,0,z); g.rotation.y=rot; scene.add(g); }
Lwall(-17,7,0); Lwall(17,7,1.57); Lwall(-17,-7,4.71); Lwall(17,-7,3.14);

const center=new THREE.Group();
const woodTex=texLoader.load('https://threejs.org/examples/textures/hardwood2_diffuse.jpg'); woodTex.wrapS=woodTex.wrapT=THREE.RepeatWrapping; woodTex.repeat.set(2,1);
const base1=new THREE.Mesh(new THREE.BoxGeometry(8.4,1.3,6.4),new THREE.MeshStandardMaterial({map:woodTex, roughness:0.75})); base1.position.y=0.65; base1.castShadow=true; base1.receiveShadow=true; center.add(base1);
const base2=new THREE.Mesh(new THREE.BoxGeometry(7.4,0.7,5.4),new THREE.MeshStandardMaterial({color:0x5A3A1F, roughness:0.6})); base2.position.set(0,3.9,0); base2.castShadow=true; center.add(base2);
[[-3,2],[3,2],[-3,-2],[3,-2]].forEach(p=>{ const pil=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,3.8,8),new THREE.MeshStandardMaterial({color:0x3D2817, roughness:0.8})); pil.position.set(p[0],2,p[1]); pil.castShadow=true; center.add(pil); });
function stairs(x,z,rot){ const g=new THREE.Group(); for(let i=0;i<8;i++){ const s=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.2,0.6),new THREE.MeshStandardMaterial({map:woodTex, roughness:0.7})); s.position.set(0,i*0.48,i*0.45); s.castShadow=true; g.add(s); } g.position.set(x,0,z); g.rotation.y=rot; center.add(g); }
stairs(-5.3,0,1.57); stairs(5.3,0,-1.57); scene.add(center);

const hayTex=texLoader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
function hayReal(x,z,s=1){ const mat=new THREE.MeshStandardMaterial({color:0xE8C97A, map:hayTex, roughness:1}); const m=new THREE.Mesh(new THREE.CylinderGeometry(0.72*s,0.88*s,1.2*s,14),mat); m.position.set(x,0.6*s,z); m.castShadow=true; m.rotation.y=Math.random()*6; scene.add(m); }
function trolleyReal(x,z,rot){ const g=new THREE.Group(); const body=new THREE.Mesh(new THREE.BoxGeometry(2.3,1,3.5),new THREE.MeshStandardMaterial({color:0x2E1D0E, roughness:0.6, metalness:0.2})); body.position.y=0.55; body.castShadow=true; const wheelGeo=new THREE.CylinderGeometry(0.38,0.38,0.22,14); wheelGeo.rotateZ(Math.PI/2); const wheelMat=new THREE.MeshStandardMaterial({color:0x111, roughness:0.9}); [[-1.1,0.32,1.3],[1.1,0.32,1.3],[-1.1,0.32,-1.3],[1.1,0.32,-1.3]].forEach(p=>{ const w=new THREE.Mesh(wheelGeo,wheelMat); w.position.set(p[0],p[1],p[2]); w.castShadow=true; g.add(w); }); const load=new THREE.Mesh(new THREE.SphereGeometry(1.05,12,10),new THREE.MeshStandardMaterial({color:0xE6C87A, roughness:1})); load.position.set(0,1.45,0); load.scale.set(1.15,0.7,1.55); load.castShadow=true; g.add(body,load); g.position.set(x,0,z); g.rotation.y=rot; scene.add(g); }
trolleyReal(-12.8,9,0.9); trolleyReal(12.8,9,-0.9); trolleyReal(-12.8,-9,-0.9); trolleyReal(12.8,-9,0.9);
for(let i=0;i<5;i++) hayReal(-10.5+(Math.random()-0.5),1.2+(Math.random()-0.5),1); for(let i=0;i<5;i++) hayReal(10.5+(Math.random()-0.5),1.2+(Math.random()-0.5),1);
for(let i=0;i<5;i++) hayReal(-9+(Math.random()-0.5),10.8+(Math.random()-0.5),1); for(let i=0;i<5;i++) hayReal(9+(Math.random()-0.5),10.8+(Math.random()-0.5),1);
for(let i=0;i<5;i++) hayReal(-9+(Math.random()-0.5),-10.8+(Math.random()-0.5),1); for(let i=0;i<5;i++) hayReal(9+(Math.random()-0.5),-10.8+(Math.random()-0.5),1);

const player=new THREE.Group();
const bodyMesh=new THREE.Mesh(new THREE.CapsuleGeometry(0.32,0.8,4,10),new THREE.MeshStandardMaterial({color:0x1a1a1a})); bodyMesh.position.y=0.9; bodyMesh.castShadow=true; player.add(bodyMesh);
// GLB Gun load
const gltfLoader=new GLTFLoader();
let gunModel=null;
gltfLoader.load('https://threejs.org/examples/models/gltf/Soldier.glb', (gltf)=>{
  // Soldier model ko gun ki jagah use nahi karenge, bas demo - real gun yahan ayega
  document.getElementById('loading').style.display='none';
}, undefined, ()=>{ document.getElementById('loading').style.display='none'; });
player.position.set(0,0,-12); scene.add(player);

let yaw=0, pitch=0.18, moveX=0, moveZ=0;
const joy=document.getElementById('joy'), knob=document.getElementById('knob'), camArea=document.getElementById('camArea');
let joyId=null, camId=null, lastX=0, lastY=0, joyCx=0, joyCy=0;
function getJoyCenter(){ const r=joy.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2}; }
document.addEventListener('touchstart', e=>{
  for(let t of e.touches){
    const el=document.elementFromPoint(t.clientX,t.clientY);
    if(joy.contains(el) || el===joy || el===knob){ joyId=t.identifier; const c=getJoyCenter(); joyCx=c.x; joyCy=c.y; }
    else if(camArea.contains(el) || t.clientX > window.innerWidth*0.38){ if(camId===null){ camId=t.identifier; lastX=t.clientX; lastY=t.clientY; } }
  }
  e.preventDefault();
},{passive:false});
document.addEventListener('touchmove', e=>{
  for(let t of e.touches){
    if(t.identifier===joyId){ let dx=t.clientX-joyCx, dy=t.clientY-joyCy; const max=48; const d=Math.hypot(dx,dy); if(d>max){ dx=dx/d*max; dy=dy/d*max; } knob.style.left=(38+dx)+'px'; knob.style.top=(38+dy)+'px'; moveX=dx/max; moveZ=dy/max; }
    if(t.identifier===camId){ const dx=t.clientX-lastX, dy=t.clientY-lastY; yaw-=dx*0.008; pitch+=dy*0.008; pitch=Math.max(-0.35,Math.min(0.65,pitch)); lastX=t.clientX; lastY=t.clientY; }
  }
  e.preventDefault();
},{passive:false});
document.addEventListener('touchend', e=>{
  let j=false,c=false; for(let t of e.touches){ if(t.identifier===joyId) j=true; if(t.identifier===camId) c=true; }
  if(!j && joyId!==null){ joyId=null; knob.style.left='38px'; knob.style.top='38px'; moveX=0; moveZ=0; }
  if(!c) camId=null;
  e.preventDefault();
},{passive:false});

function animate(){ requestAnimationFrame(animate); const fwd=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)); const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)); player.position.addScaledVector(fwd,-moveZ*0.13); player.position.addScaledVector(right,-moveX*0.13); player.position.x=Math.max(-18,Math.min(18,player.position.x)); player.position.z=Math.max(-13.5,Math.min(13.5,player.position.z)); const dist=6.2, cosP=Math.cos(pitch), sinP=Math.sin(pitch); camera.position.set(player.position.x - Math.sin(yaw)*cosP*dist, player.position.y + 2.2 + sinP*3.8, player.position.z - Math.cos(yaw)*cosP*dist); camera.lookAt(player.position.x, player.position.y+0.9, player.position.z); renderer.render(scene,camera); } animate();
function resize(){ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); }
window.addEventListener('resize',resize); resize();
async function goFull(){ try{ if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){} }
document.addEventListener('touchend', goFull, {once:true});
setTimeout(()=>{ const l=document.getElementById('loading'); if(l) l.style.display='none'; },3000);
</script>
</body>
</html>
